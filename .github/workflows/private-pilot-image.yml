name: Private pilot image

on:
  workflow_dispatch:
  push:
    branches:
      - deployment/private-piper-pilot

permissions:
  contents: read
  packages: write

concurrency:
  group: private-pilot-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/coreyhammond/openwebtts

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          npm ci --ignore-scripts
      - name: Build frontend and run tests
        run: |
          npm run build
          python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux AMD64 smoke candidate
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg SOURCE_REVISION=${GITHUB_SHA} \
            --load \
            --tag openwebtts-smoke:${GITHUB_SHA} \
            .
      - name: Run startup, security, Piper and persistence smoke tests
        run: scripts/container_smoke.sh openwebtts-smoke:${GITHUB_SHA}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        run: |
          docker tag openwebtts-smoke:${GITHUB_SHA} ${IMAGE_NAME}:sha-${GITHUB_SHA}
          docker push ${IMAGE_NAME}:sha-${GITHUB_SHA}
      - name: Record immutable digest
        run: |
          digest=$(docker image inspect ${IMAGE_NAME}:sha-${GITHUB_SHA} --format '{{index .RepoDigests 0}}')
          printf 'Image: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
